<app-dialog>
  <mat-dialog-content>
    <mat-radio-group (change)="onRadioButtonChange($event)" class="radio-group">
      <mat-radio-button class="radio-button"
          [checked]="selectedOption == uploadSelection.TakePicture"
          [value]="uploadSelection.TakePicture">
        Foto aufnehmen
      </mat-radio-button>
      <mat-radio-button class="radio-button"
          [checked]="selectedOption == uploadSelection.UploadFromGallery"
          [value]="uploadSelection.UploadFromGallery">
        Aus Galerie hochladen
      </mat-radio-button>
    </mat-radio-group>

    <div *ngIf="selectedOption == uploadSelection.TakePicture">
      <button *ngIf="!image" type="button" class="btn sec2 full" (click)="cameraInput.click()">
        <mat-icon>photo_camera</mat-icon><span>Foto aufnehmen</span>
        <input style="display: none" #cameraInput type="file" accept="image/*" capture="environment" (change)="onChooseFile(cameraInput)">
      </button>
    </div>

    <div *ngIf="selectedOption == uploadSelection.UploadFromGallery">
      <button *ngIf="!image" type="button" class="btn sec2 full" (click)="hiddenImageInput.click()">
        <mat-icon>upload</mat-icon><span>Foto auswählen</span>
        <input style="display: none" #hiddenImageInput type="file" accept="image/*" (change)="onChooseFile(hiddenImageInput)">
      </button>
    </div>

    <div *ngIf="image" class="preview">
      <img src="{{ image.src }}" [width]="maxPreviewWidth" alt="Rechnungsfoto">
    </div>
  </mat-dialog-content>

  <div class="actions">
    <button type="button" class="btn pri" [disabled]="!image"
        (click)="onChooseImageClick()">
      Übernehmen
    </button>
  </div>
</app-dialog>
