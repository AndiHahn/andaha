<div class="form-container">
  <!-- Datumstyp als Segment aus nativen Radios (design.md 3.2) -->
  <div class="segment" role="radiogroup" aria-label="Datumstyp" (click)="$event.stopPropagation();">
    @for (dateTypeOption of dateTypeOptions; track dateTypeOption) {
      <label>
        <input type="radio" name="dateType" [value]="dateTypeOption" [checked]="dateTypeOption === selectedDateType()"
          (change)="selectDateType(dateTypeOption)">
        <span>{{ dateTypeSegmentLabels[dateTypeOption] }}</span>
      </label>
    }
  </div>

  <!-- ‹ Zeitraum › bei Monat und Jahr, an den Grenzen des verfügbaren Zeitraums deaktiviert -->
  @if (hasArrows()) {
    <div class="period">
      <button type="button" class="icon-btn" aria-label="Vorheriger Zeitraum" [disabled]="!canGoBack()" (click)="previous()">
        <mat-icon aria-hidden="true">chevron_left</mat-icon>
      </button>
      <span class="period-label" aria-live="polite">{{ periodLabel() }}</span>
      <button type="button" class="icon-btn" aria-label="Nächster Zeitraum" [disabled]="!canGoForward()" (click)="next()">
        <mat-icon aria-hidden="true">chevron_right</mat-icon>
      </button>
    </div>
  }

  @if (selectedDateType() === dateType.Custom) {
    <form [formGroup]="form" class="range">
      <label class="field">
        <span class="field-label">Von</span>
        <span class="field-box">
          <input [matDatepicker]="pickerFrom" formControlName="fromDate" aria-label="Von"
            (ngModelChange)="customDateChanged()">
          <mat-datepicker-toggle class="suffix" [for]="pickerFrom" [aria-label]="'Kalender öffnen'">
            <mat-icon matDatepickerToggleIcon>calendar_today</mat-icon>
          </mat-datepicker-toggle>
          <mat-datepicker #pickerFrom />
        </span>
      </label>
      <label class="field">
        <span class="field-label">Bis</span>
        <span class="field-box">
          <input [matDatepicker]="pickerTo" formControlName="toDate" aria-label="Bis"
            (ngModelChange)="customDateChanged()">
          <mat-datepicker-toggle class="suffix" [for]="pickerTo" [aria-label]="'Kalender öffnen'">
            <mat-icon matDatepickerToggleIcon>calendar_today</mat-icon>
          </mat-datepicker-toggle>
          <mat-datepicker #pickerTo />
        </span>
      </label>
    </form>
  }
</div>
