<form class="page" [formGroup]="form" #formDirective="ngForm" (ngSubmit)="onSubmit(formDirective)">
  <div class="form-body">
    <app-bill-image [editing]="true" [saving]="false" [onlyUpload]="true"
        (imageSelected)="onImageSelected($event)">
    </app-bill-image>

    <label class="field" [class.invalid]="form.controls.shopName | showError: formDirective">
      <span class="field-label">Shopname</span>
      <span class="field-box">
        <input formControlName="shopName" required [attr.aria-invalid]="form.controls.shopName | showError: formDirective">
      </span>
    </label>

    <label class="field" [class.invalid]="form.controls.notes | showError: formDirective">
      <span class="field-label">Notizen</span>
      <span class="field-box ta">
        <textarea formControlName="notes" [attr.aria-invalid]="form.controls.notes | showError: formDirective"></textarea>
      </span>
    </label>

    <label class="field" [class.invalid]="form.controls.price | showError: formDirective">
      <span class="field-label">Preis</span>
      <span class="field-box">
        <input class="price" formControlName="price" type="number" required autocomplete="off" [attr.aria-invalid]="form.controls.price | showError: formDirective">
        <span class="suffix" aria-hidden="true">€</span>
      </span>
    </label>

    <div class="field" [class.invalid]="form.controls.category | showError: formDirective">
      <span class="field-label">Kategorie</span>
      <span class="field-box">
        <mat-select formControlName="category" required aria-label="Kategorie" (selectionChange)="categorySelectionChanged($event)">
          <mat-select-trigger>
            <span class="trigger">
              <span class="dot" [class.dot-light]="form.controls.category.value?.color == 'white'"
                  [style.background]="form.controls.category.value?.color"></span>
              {{ form.controls.category.value?.name }}
            </span>
          </mat-select-trigger>
          <mat-option *ngFor="let category of billCategories" [value]="category">
            {{category?.name}}
          </mat-option>
        </mat-select>
        <mat-icon class="suffix" aria-hidden="true">expand_more</mat-icon>
      </span>
    </div>

    <div class="field" *ngIf="billSubCategories && billSubCategories.length > 0">
      <span class="field-label">Unterkategorie</span>
      <span class="field-box">
        <mat-select formControlName="subCategory" aria-label="Unterkategorie">
          <mat-option></mat-option>
          <mat-option *ngFor="let subCategory of billSubCategories" [value]="subCategory">
            {{subCategory?.name}}
          </mat-option>
        </mat-select>
        <mat-icon class="suffix" aria-hidden="true">expand_more</mat-icon>
      </span>
    </div>

    <label class="field" [class.invalid]="form.controls.date | showError: formDirective">
      <span class="field-label">Datum</span>
      <span class="field-box">
        <input [matDatepicker]="picker" formControlName="date" aria-label="Datum" aria-describedby="add-bill-date-hint" [attr.aria-invalid]="form.controls.date | showError: formDirective">
        <mat-datepicker-toggle class="suffix" [for]="picker" [aria-label]="'Kalender öffnen'">
          <mat-icon matDatepickerToggleIcon>calendar_today</mat-icon>
        </mat-datepicker-toggle>
        <mat-datepicker #picker></mat-datepicker>
      </span>
      <span class="field-hint" id="add-bill-date-hint">DD.MM.YYYY</span>
    </label>
  </div>

  <div class="actions">
    <button type="submit" class="btn pri" [disabled]="!form.valid || isSaving">
      <mat-icon>check</mat-icon><span>Speichern</span>
    </button>
  </div>
</form>
