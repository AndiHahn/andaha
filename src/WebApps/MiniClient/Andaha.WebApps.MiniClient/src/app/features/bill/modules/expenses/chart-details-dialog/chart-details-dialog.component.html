<app-dialog [title]="categoryName">
  <mat-dialog-content>
    <!-- Kopf: Kategorie-Summe (Mockup 02, Kategorie-Details) -->
    <div class="head">
      <span class="head-label">Ausgaben für {{ categoryName }}</span>
      <span class="big">{{ truncate(2, sum) | number:'1.2-2':'de' }}<small>€</small></span>
    </div>

    <div *ngIf="subCategoryExpenses.length == 0" class="empty">
      Keine Kosten von Subkategorien verfügbar.
    </div>
    <div class="kv" *ngFor="let expense of subCategoryExpenses">
      <span class="k">{{ expense?.subCategory }}</span>
      <span class="v">{{ truncate(2, expense?.costs) | number:'1.2-2':'de' }} €</span>
    </div>
  </mat-dialog-content>
</app-dialog>
