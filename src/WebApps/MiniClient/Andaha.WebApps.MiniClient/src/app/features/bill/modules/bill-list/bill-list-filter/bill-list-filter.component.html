<div class="filter">
  <!-- Desktop: Eingabezeile der Schnellerfassung vor der Suche (04-shortcut-desktop) -->
  <ng-content select="[filterLead]" />
  <div class="search-row">
    <label class="field search-field">
      <span class="field-box">
        <mat-icon>search</mat-icon>
        <input type="text"
          enterkeyhint="search"
          [readonly]="deactivate"
          #searchTerm
          [value]="inputFieldValue"
          (input)="onSearchInput(searchTerm.value)"
          (keyup.enter)="onSearchEnter(searchTerm.value)"
          (keydown)="searchBoxKeyDown($event)"
          placeholder="Suche Rechnungen..."
          aria-label="Rechnungen durchsuchen">
        @if (searchTerm.value) {
          <button type="button" class="icon-btn clear-btn"
            aria-label="Clear"
            (click)="onClearSearch()">
            <mat-icon>close</mat-icon>
          </button>
        }
      </span>
    </label>

    <button type="button" class="icon-btn filter-btn" (click)="onFilterClick()" aria-label="Datumfilter öffnen">
      <mat-icon>filter_list</mat-icon>
      @if (fromDateFilter || untilDateFilter) {
        <span class="badge"></span>
      }
    </button>
  </div>

  <div class="chips" data-no-swipe>
    @for (category of categories; track category.category?.id ?? category.displayName; let i = $index) {
      <button type="button" class="chip"
        [class.on]="category.selected"
        [attr.aria-pressed]="category.selected"
        (click)="onChipClick(i)">
        @if (category.selected) {
          <mat-icon aria-hidden="true">check</mat-icon>
        }{{ category.displayName }}
      </button>
    }
  </div>

  @if (fromDateFilter || untilDateFilter) {
    <div class="chips date-chips" data-no-swipe>
      @if (fromDateFilter) {
        <span class="chip date-chip">
          <button type="button" class="date-chip-label" (click)="onFilterClick()">Von: {{ fromDateFilter | date:'dd.MM.yyyy' }}</button>
          <button type="button" class="x" (click)="onFromDateFilterRemoveClick()" aria-label="Von-Datum entfernen">
            <mat-icon>close</mat-icon>
          </button>
        </span>
      }
      @if (untilDateFilter) {
        <span class="chip date-chip">
          <button type="button" class="date-chip-label" (click)="onFilterClick()">Bis: {{ untilDateFilter | date:'dd.MM.yyyy' }}</button>
          <button type="button" class="x" (click)="onUntilDateFilterRemoveClick()" aria-label="Bis-Datum entfernen">
            <mat-icon>close</mat-icon>
          </button>
        </span>
      }
    </div>
  }

  <button type="button" class="chip filter-chip" (click)="onFilterClick()">
    <mat-icon aria-hidden="true">calendar_today</mat-icon>Datumfilter
  </button>
</div>
