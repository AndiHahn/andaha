<div class="filter">
  <div class="search-row">
    <label class="field search-field">
      <span class="field-box">
        <mat-icon>search</mat-icon>
        <input type="text"
          [readonly]="deactivate"
          #searchTerm
          [value]="inputFieldValue"
          (keyup)="searchBoxKeyup.emit(searchTerm.value)"
          (keydown)="searchBoxKeyDown($event)"
          placeholder="Suche Rechnungen..."
          aria-label="Rechnungen durchsuchen">
        <button type="button" *ngIf="searchTerm.value" class="icon-btn clear-btn"
          aria-label="Clear"
          (click)="onClearSearch()">
          <mat-icon>close</mat-icon>
        </button>
      </span>
    </label>

    <button type="button" class="icon-btn filter-btn" (click)="onFilterClick()" aria-label="Datumfilter öffnen">
      <mat-icon>filter_list</mat-icon>
      <span class="badge" *ngIf="fromDateFilter || untilDateFilter"></span>
    </button>
  </div>

  <div class="chips">
    <button type="button" class="chip" *ngFor="let category of categories; index as i"
      [class.on]="category.selected"
      [attr.aria-pressed]="category.selected"
      (click)="onChipClick(i)">
      <mat-icon *ngIf="category.selected" aria-hidden="true">check</mat-icon>{{ category.displayName }}
    </button>
  </div>

  <div *ngIf="fromDateFilter || untilDateFilter" class="chips date-chips">
    <span class="chip date-chip" *ngIf="fromDateFilter">
      <button type="button" class="date-chip-label" (click)="onFilterClick()">Von: {{ fromDateFilter | date:'dd.MM.yyyy' }}</button>
      <button type="button" class="x" (click)="onFromDateFilterRemoveClick()" aria-label="Von-Datum entfernen">
        <mat-icon>close</mat-icon>
      </button>
    </span>
    <span class="chip date-chip" *ngIf="untilDateFilter">
      <button type="button" class="date-chip-label" (click)="onFilterClick()">Bis: {{ untilDateFilter | date:'dd.MM.yyyy' }}</button>
      <button type="button" class="x" (click)="onUntilDateFilterRemoveClick()" aria-label="Bis-Datum entfernen">
        <mat-icon>close</mat-icon>
      </button>
    </span>
  </div>

  <button type="button" class="chip filter-chip" (click)="onFilterClick()">
    <mat-icon aria-hidden="true">calendar_today</mat-icon>Datumfilter
  </button>
</div>
