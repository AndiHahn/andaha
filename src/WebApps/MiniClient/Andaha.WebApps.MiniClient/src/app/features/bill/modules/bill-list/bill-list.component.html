<div #filterBar class="filter-container" [class.collapsed]="!showFilterBar" (transitionend)="viewport.checkViewportSize()">
  <app-bill-list-filter [deactivate]="loading"
    [initialSearchText]="initialSearchValue"
    [initialCategoryFilters]="initialCategoryFilters"
    [initialDateFilter]="initialDateFilter"
    (searchTextChanged)="onSearchInput($event)"
    (categoryFilterChanged)="onCategoryFilterChanged($event)"
    (dateFilterChanged)="onDateFilterChanged($event)"  />
</div>

<div class="progress-slot">
  @if (loading) {
    <mat-progress-bar mode="indeterminate" color="accent" />
  }
</div>

<div class="table-head" aria-hidden="true">
  <span>Datum</span>
  <span>Shop</span>
  <span>Kategorie</span>
  <span></span>
  <span class="r">Preis</span>
</div>

@if (!loading && totalCount === 0) {
  <div class="empty">
    Keine Rechnungen verfügbar.
  </div>
}

<cdk-virtual-scroll-viewport #viewport class="list" [itemSize]="pixelHeightPerItem">
  <a *cdkVirtualFor="let bill of billDataSource" class="bill-link" routerLink="/bill/{{bill.id}}">
    <app-bill-list-item [bill]="bill" />
  </a>
</cdk-virtual-scroll-viewport>

<div style="display: none;">
  <mat-paginator class="paginator"
    [length]="totalResults"
    [pageSize]="pageSize"
    [pageSizeOptions]="[20, 50, 100]"
    aria-label="Select page"
    (page)="onPageChange($event)" />
</div>
