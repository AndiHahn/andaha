<app-dialog [title]="'Datumfilter'">
  <mat-dialog-content>
    <div class="form">
      <div class="field">
        <label class="field-label" for="bill-filter-from">Von</label>
        <div class="box-row">
          <span class="field-box">
            <input id="bill-filter-from" [matDatepicker]="dpFrom" [formControl]="dateFrom" aria-describedby="bill-filter-from-hint">
            <mat-datepicker-toggle class="suffix" [for]="dpFrom" [aria-label]="'Kalender öffnen'">
              <mat-icon matDatepickerToggleIcon>calendar_today</mat-icon>
            </mat-datepicker-toggle>
            <mat-datepicker #dpFrom></mat-datepicker>
          </span>
          <button type="button" class="icon-btn clear-btn" (click)="onClearFromDateClick()" aria-label="Von-Datum leeren">
            <mat-icon>close</mat-icon>
          </button>
        </div>
        <span class="field-hint" id="bill-filter-from-hint">DD.MM.YYYY</span>
      </div>

      <div class="field">
        <label class="field-label" for="bill-filter-until">Bis</label>
        <div class="box-row">
          <span class="field-box">
            <input id="bill-filter-until" [matDatepicker]="dpUntil" [formControl]="dateUntil" aria-describedby="bill-filter-until-hint">
            <mat-datepicker-toggle class="suffix" [for]="dpUntil" [aria-label]="'Kalender öffnen'">
              <mat-icon matDatepickerToggleIcon>calendar_today</mat-icon>
            </mat-datepicker-toggle>
            <mat-datepicker #dpUntil></mat-datepicker>
          </span>
          <button type="button" class="icon-btn clear-btn" (click)="onClearUntilDateClick()" aria-label="Bis-Datum leeren">
            <mat-icon>close</mat-icon>
          </button>
        </div>
        <span class="field-hint" id="bill-filter-until-hint">DD.MM.YYYY</span>
      </div>
    </div>
  </mat-dialog-content>

  <div class="actions">
    <button type="button" class="btn pri" (click)="onTakeOverClick()">Übernehmen</button>
  </div>
</app-dialog>
