<div class="scan">
  <div class="photo">
    <img [src]="previewUrl" alt="Foto der Rechnung">
  </div>
  <div class="state" role="status">
    <mat-progress-spinner mode="indeterminate" diameter="22" />
    <span>Rechnung wird gelesen …</span>
  </div>
  <button type="button" class="btn sec2" mat-dialog-close>Abbrechen</button>
</div>
