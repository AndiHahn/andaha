<div class="dock">
  <button type="button" class="in" aria-label="Neue Rechnung, Betrag eingeben" (click)="openEntry.emit()">
    <mat-icon aria-hidden="true">add</mat-icon>
    <span class="ph">Neue Rechnung: Betrag</span>
    <span class="sfx">€</span>
  </button>
  @if (layout === 'mobile') {
    <button type="button" class="cam" aria-label="Rechnung scannen" (click)="photoInput.click()">
      <mat-icon aria-hidden="true">photo_camera</mat-icon>
    </button>
  } @else {
    <button type="button" class="btn sec2 scan" (click)="photoInput.click()">
      <mat-icon aria-hidden="true">photo_camera</mat-icon><span>Scannen</span>
    </button>
  }
  <!-- Mehrere Fotos aus Kamera-App bzw. Galerie (mobil) oder Dateiauswahl (Desktop); ohne capture, sonst nur ein Foto -->
  <input #photoInput class="file" type="file" accept="image/*" multiple tabindex="-1" aria-hidden="true"
    (change)="onPhotoChosen(photoInput)">
</div>
