<app-dialog>
  <mat-dialog-content>
    <!-- limitZoom explizit: @meddv/ngx-pinch-zoom 20 ueberschreibt den Standard "original image size" sonst mit undefined (max. Zoom 3 statt Originalgroesse) -->
    @if (imageSrc) {
      <pinch-zoom limitZoom="original image size" style="width: 100%;">
        <img [src]="imageSrc" alt="Rechnungsfoto" />
      </pinch-zoom>
    }

    @if (isLoading) {
      <div class="action-container">
        <mat-spinner diameter="40"></mat-spinner>
      </div>
    }
  </mat-dialog-content>

  <div class="progress-slot">
    @if (isDeleting) {
      <mat-progress-bar mode="indeterminate" color="accent"></mat-progress-bar>
    }
  </div>

  <div class="actions">
    <button type="button" class="btn del" [disabled]="isDeleting || isLoading || !imageSrc"
      (click)="onDeleteImageClick()">
      <mat-icon>delete</mat-icon><span>Löschen</span>
    </button>
  </div>
</app-dialog>
