<app-dialog>
  <mat-dialog-content>
    <pinch-zoom *ngIf="imageSrc" style="width: 100%;">
      <img [src]="imageSrc" alt="Rechnungsfoto" />
    </pinch-zoom>

    <div *ngIf="isLoading" class="action-container">
      <mat-spinner diameter="40"></mat-spinner>
    </div>
  </mat-dialog-content>

  <div class="progress-slot">
    <mat-progress-bar *ngIf="isDeleting" mode="indeterminate" color="accent"></mat-progress-bar>
  </div>

  <div class="actions">
    <button type="button" class="btn del" [disabled]="isDeleting || isLoading || !imageSrc"
        (click)="onDeleteImageClick()">
      <mat-icon>delete</mat-icon><span>Löschen</span>
    </button>
  </div>
</app-dialog>
