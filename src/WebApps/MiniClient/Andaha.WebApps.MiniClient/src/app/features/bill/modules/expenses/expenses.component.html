<div class="page">
  @if (availableTimeRange(); as available) {
    <app-timerange-selection [availableTimeRange]="available" (selectionChanged)="timeSelectionChanged($event)" />
  }

  <!-- Summe mit Vergleich, Monatsbalken und Kategoriezeilen (design.md 3.2, Mockup 01 B) -->
  <app-load-state [state]="loadState()" [emptyText]="emptyText" (retry)="retry()">
    <div class="tot">
      <span class="v">{{ sum() | number:'1.2-2':'de' }}<small>€</small></span>
      @if (totalChange(); as change) {
        <span class="delta" [class]="change.direction">{{ change.text }}</span>
      }
    </div>

    @if (months(); as months) {
      <app-monthly-bars [months]="months" [highlight]="highlight()" />
    }

    <app-category-rows [expenses]="expenses() ?? []" [previousExpenses]="previousExpenses()"
      (categorySelected)="openCategory($event)" />
  </app-load-state>
</div>
