<div class="page">
  <app-timerange-selection *ngIf="availableTimeRange" [availableTimeRange]="availableTimeRange"
    (selectionChanged)="timeSelectionChanged($event)">
  </app-timerange-selection>
  <div *ngIf="!availableTimeRange" class="loading">
    <mat-spinner diameter="40"></mat-spinner>
  </div>

  <div class="empty" *ngIf="!isLoading && expenses.length == 0">
    Keine Daten vorhanden.
  </div>

  <div *ngIf="isLoading" class="loading">
    <mat-spinner diameter="40"></mat-spinner>
  </div>

  <!-- Ring, Summe und Legende (ersetzt die bisherige Summen-/Kategorienliste, umsetzung.md Statistik) -->
  <app-chart *ngIf="!isLoading && expenses.length > 0 && categories.length > 0"
    [expenses]="expenses" [categories]="categories" [selectedTimeRange]="selectedTimeRange" [sum]="sum">
  </app-chart>
</div>
