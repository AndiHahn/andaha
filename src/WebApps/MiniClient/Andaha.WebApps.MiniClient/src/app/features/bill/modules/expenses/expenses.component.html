<div class="page">
  @if (availableTimeRange) {
    <app-timerange-selection [availableTimeRange]="availableTimeRange"
      (selectionChanged)="timeSelectionChanged($event)">
    </app-timerange-selection>
  }
  @if (!availableTimeRange) {
    <div class="loading">
      <mat-spinner diameter="40"></mat-spinner>
    </div>
  }

  @if (!isLoading && expenses.length == 0) {
    <div class="empty">
      Keine Daten vorhanden.
    </div>
  }

  @if (isLoading) {
    <div class="loading">
      <mat-spinner diameter="40"></mat-spinner>
    </div>
  }

  <!-- Ring, Summe und Legende (ersetzt die bisherige Summen-/Kategorienliste, umsetzung.md Statistik) -->
  @if (!isLoading && expenses.length > 0 && categories.length > 0) {
    <app-chart
      [expenses]="expenses" [categories]="categories" [selectedTimeRange]="selectedTimeRange" [sum]="sum"
      [hiddenCategories]="hiddenCategories" (visibilityToggled)="toggleCategory($event)">
    </app-chart>
  }
</div>
