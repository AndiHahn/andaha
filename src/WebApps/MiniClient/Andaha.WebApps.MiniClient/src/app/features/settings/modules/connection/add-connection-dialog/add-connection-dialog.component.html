<app-dialog [title]="'Verbindung zu Benutzer anfordern:'">
  <form class="dialog-form" [formGroup]="formGroup" (ngSubmit)="onSubmitClick()" #formDirective="ngForm">
    <mat-dialog-content>
      <div class="form">
        <label class="field" [class.invalid]="formGroup.controls['emailAddress'] | showError: formDirective">
          <span class="field-label">Email Adresse</span>
          <span class="field-box">
            <input formControlName="emailAddress" email autocomplete="off"
                   [attr.aria-invalid]="formGroup.controls['emailAddress'] | showError: formDirective"
                   [attr.aria-describedby]="(formGroup.controls['emailAddress'] | showError: formDirective) ? 'add-connection-email-error' : null">
          </span>
          <span class="field-error" id="add-connection-email-error" *ngIf="formGroup.controls['emailAddress'] | showError: formDirective">
            Keine gültige email Adresse.
          </span>
        </label>

        <span class="field-error" role="alert" *ngIf="errorMessage">{{ errorMessage }}</span>
      </div>
    </mat-dialog-content>

    <div class="actions">
      <button type="submit" class="btn pri" [disabled]="isSaving">
        <ng-container *ngIf="!isSaving"><span>Verbindung anfordern</span></ng-container>
        <ng-container *ngIf="isSaving"><mat-spinner class="btn-spinner" [diameter]="18"></mat-spinner><span>Speichert …</span></ng-container>
      </button>
    </div>
  </form>
</app-dialog>
