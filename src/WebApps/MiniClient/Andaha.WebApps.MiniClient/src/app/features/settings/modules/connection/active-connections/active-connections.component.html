<div class="master-container">
  <div *ngIf="loading && !connections">
    <mat-spinner diameter="40"></mat-spinner>
  </div>
  
  <div class="empty" *ngIf="!loading && connections && connections.length == 0">
    Keine Verbindungen vorhanden.
  </div>
</div>

<div class="row" *ngFor="let connection of connections">
  <span class="t">{{ connection.userEmailAddress }}</span>
  <span class="st ok"><span class="dot"></span>aktiv</span>
</div>
