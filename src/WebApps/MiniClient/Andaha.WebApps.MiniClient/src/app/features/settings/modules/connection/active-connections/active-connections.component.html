<app-load-state [state]="loadState" emptyText="Noch keine Verbindungen. Mit „Verbindung herstellen“ teilst du Rechnungen, Haushalt und Stunden mit einer anderen Person." (retry)="onRetry()">
  @for (connection of connections; track connection.userId) {
    <div class="crow">
      <div class="main">
        <div class="t">{{ connection.userEmailAddress }}</div>
        <span>teilt Rechnungen, Haushalt und Stunden</span>
      </div>
      <button type="button" class="mbtn r" [disabled]="busyUserId === connection.userId" (click)="onRemoveClick(connection)">
        @if (busyUserId === connection.userId) {
          <mat-spinner [diameter]="16" />
        }
        <span>Trennen</span>
      </button>
    </div>
  }
</app-load-state>
