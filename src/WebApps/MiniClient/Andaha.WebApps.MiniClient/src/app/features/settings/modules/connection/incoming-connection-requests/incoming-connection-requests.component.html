<app-load-state [state]="loadState" emptyText="Keine eingehenden Anfragen. Wenn dir jemand eine Verbindung anbietet, erscheint die Anfrage hier." (retry)="onRetry()">
  @for (connectionRequest of connectionRequests; track connectionRequest.fromUserId + '|' + connectionRequest.targetUserId) {
    <div class="crow">
      <div class="main"><div class="t">{{ connectionRequest.fromUserEmailAddress }}</div></div>
      <button type="button" class="mbtn g" [disabled]="busyUserId === connectionRequest.fromUserId" (click)="onDeclineClick(connectionRequest)">
        @if (busyUserId === connectionRequest.fromUserId && busyAction === 'decline') {
          <mat-spinner [diameter]="16" />
        }
        <span>Ablehnen</span>
      </button>
      <button type="button" class="mbtn p" [disabled]="busyUserId === connectionRequest.fromUserId" (click)="onAcceptClick(connectionRequest)">
        @if (busyUserId === connectionRequest.fromUserId && busyAction === 'accept') {
          <mat-spinner [diameter]="16" />
        }
        <span>Annehmen</span>
      </button>
    </div>
  }
</app-load-state>
