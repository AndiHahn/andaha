<div class="master-container">
  <div *ngIf="loading && !connectionRequests">
    <mat-spinner diameter="40"></mat-spinner>
  </div>
  
  <div class="empty" *ngIf="!loading && connectionRequests && connectionRequests.length == 0">
    Keine eingehenden Verbindungsanfragen vorhanden.
  </div>
</div>

<div class="row" *ngFor="let connectionRequest of connectionRequests">
  <span class="t">{{ connectionRequest.fromUserEmailAddress }}</span>
  <button type="button" class="mini accept" aria-label="Anfrage annehmen" (click)="onAcceptClick(connectionRequest)"><mat-icon>check</mat-icon></button>
  <button type="button" class="mini decline" aria-label="Anfrage ablehnen" (click)="onDeclineClick(connectionRequest)"><mat-icon>close</mat-icon></button>
</div>
