<div class="page">
  <!--
  FORM
  -->
  <form class="form-body" [formGroup]="form">
    <label class="field" [class.invalid]="form.controls.name | showError">
      <span class="field-label">Name der Kategorie</span>
      <span class="field-box">
        <input formControlName="name" required [attr.aria-invalid]="form.controls.name | showError">
      </span>
    </label>

    <div class="field" [class.invalid]="form.controls.color | showError">
      <span class="field-label">Farbe</span>
      <app-color-swatches [formControl]="form.controls.color" />
    </div>

    <div class="cb">
      <mat-checkbox
        class="andaha-checkbox"
        [checked]="includeToStatisticsCheckbox"
        (change)="updateIncludeToStatistics()">Aufnehmen in Statistik</mat-checkbox>
    </div>
  </form>

  <!--
  AKTIONEN
  -->
  <div class="actions">
    <button type="button" class="btn pri" (click)="onSaveClick()"
      [disabled]="isSaving || !form.valid">
      @if (!isSaving) {
        <mat-icon>check</mat-icon><span>Speichern</span>
      }
      @if (isSaving) {
        <mat-spinner class="btn-spinner" [diameter]="18" /><span>Speichert …</span>
      }
    </button>
  </div>
</div>
