<app-load-state [state]="loadState" emptyText="Keine gesendeten Anfragen." (retry)="onRetry()">
  @for (connectionRequest of connectionRequests; track connectionRequest.fromUserId + '|' + connectionRequest.targetUserId) {
    <div class="crow">
      <div class="main">
        <div class="t">{{ connectionRequest.targetUserEmailAddress }}</div>
        <span>{{ connectionRequest.declined ? 'abgelehnt' : 'wartet auf Antwort' }}</span>
      </div>
      <button type="button" class="mbtn g" [disabled]="busyTargetUserId === connectionRequest.targetUserId" (click)="onWithdrawClick(connectionRequest)">
        @if (busyTargetUserId === connectionRequest.targetUserId) {
          <mat-spinner [diameter]="16" />
        }
        <span>Zurückziehen</span>
      </button>
    </div>
  }
</app-load-state>
