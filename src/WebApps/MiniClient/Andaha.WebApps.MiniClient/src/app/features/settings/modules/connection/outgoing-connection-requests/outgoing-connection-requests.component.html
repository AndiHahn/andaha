<div class="master-container">
  <div *ngIf="loading && !connectionRequests">
    <mat-spinner diameter="40"></mat-spinner>
  </div>
  
  <div class="empty" *ngIf="!loading && connectionRequests && connectionRequests.length == 0">
    Keine ausgehenden Verbindungsanfragen vorhanden.
  </div>
</div>

<div class="row" *ngFor="let connectionRequest of connectionRequests">
  <span class="t">{{ connectionRequest.targetUserEmailAddress }}</span>
  <span *ngIf="!connectionRequest.declined" class="st wait"><span class="dot"></span>ausstehend</span>
  <span *ngIf="connectionRequest.declined" class="st no"><span class="dot"></span>abgelehnt</span>
</div>
