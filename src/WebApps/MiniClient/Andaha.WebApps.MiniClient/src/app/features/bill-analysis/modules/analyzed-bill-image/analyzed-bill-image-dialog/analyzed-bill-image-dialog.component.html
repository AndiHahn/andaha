<app-dialog>
  <mat-dialog-content>
    @if (isLoading) {
      <div class="action-container">
        <mat-progress-spinner mode="indeterminate" [diameter]="40"></mat-progress-spinner>
      </div>
    }
    @if (!isLoading && imageSrc) {
      <img [src]="imageSrc" alt="Rechnungsfoto" />
    }
  </mat-dialog-content>
</app-dialog>
