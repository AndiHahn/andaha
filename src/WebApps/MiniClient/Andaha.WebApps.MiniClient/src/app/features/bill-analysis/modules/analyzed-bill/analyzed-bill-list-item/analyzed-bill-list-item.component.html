<div class="row analyzed-row">
  <div class="date">
    <b>{{ bill.date | date:'dd':undefined:'de' }}</b>
    <span>{{ bill.date | date:'LLL':undefined:'de' }}</span>
  </div>
  <div class="date-full">{{ bill.date | date:'dd.MM.yyyy':undefined:'de' }}</div>
  <div class="t">{{ bill.shopName }}</div>
  <div class="amt">{{ bill.price | number:'1.2-2':'de' }}<small>€</small></div>
</div>
