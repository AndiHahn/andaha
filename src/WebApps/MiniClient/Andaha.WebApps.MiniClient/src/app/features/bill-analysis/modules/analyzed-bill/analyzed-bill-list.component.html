<div class="progress-slot">
  @if (loading) {
    <mat-progress-bar mode="indeterminate" color="accent"></mat-progress-bar>
  }
</div>

@if (!loading && totalCount === 0) {
  <div class="empty">
    Keine Rechnungen verfügbar.
  </div>
}

<cdk-virtual-scroll-viewport class="list" [itemSize]="pixelHeightPerItem">
  <a *cdkVirtualFor="let bill of billDataSource" class="bill-link" [routerLink]="['/analyzed', bill.id]">
    <app-analyzed-bill-list-item [bill]="bill" [categories]="categories"></app-analyzed-bill-list-item>
  </a>
</cdk-virtual-scroll-viewport>

<div style="display: none;">
  <mat-paginator
    class="paginator"
    [length]="totalResults"
    [pageSize]="pageSize"
    [pageSizeOptions]="[20, 50, 100]"
    aria-label="Select page"
    (page)="onPageChange($event)">
  </mat-paginator>
</div>
