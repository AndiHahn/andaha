<div class="progress-slot">
  @if (loading) {
    <mat-progress-bar mode="indeterminate" color="accent" />
  }
</div>

@if (!loading && totalCount === 0) {
  <div class="empty">
    Keine Rechnungen verfügbar.
  </div>
}

<cdk-virtual-scroll-viewport class="list" [itemSize]="pixelHeightPerItem">
  <a *cdkVirtualFor="let bill of billDataSource" class="bill-link" [routerLink]="['/bill/analysis', bill.id]">
    <app-analyzed-bill-list-item [bill]="bill" [categories]="categories" />
  </a>
</cdk-virtual-scroll-viewport>
