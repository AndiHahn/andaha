<div class="progress-slot">
  <mat-progress-bar *ngIf="loading" mode="indeterminate" color="accent"></mat-progress-bar>
</div>

<div class="empty" *ngIf="!loading && totalCount === 0">
  Keine Rechnungen verfügbar.
</div>

<cdk-virtual-scroll-viewport class="list" [itemSize]="pixelHeightPerItem">
  <a *cdkVirtualFor="let bill of billDataSource" class="bill-link" [routerLink]="['/analyzed', bill.id]">
    <app-analyzed-bill-list-item [bill]="bill"></app-analyzed-bill-list-item>
  </a>
</cdk-virtual-scroll-viewport>

<div style="display: none;">
  <mat-paginator
    class="paginator"
    [length]="totalResults"
    [pageSize]="pageSize"
    [pageSizeOptions]="[20, 50, 100]"
    aria-label="Select page"
    (page)="onPageChange($event)">
  </mat-paginator>
</div>
