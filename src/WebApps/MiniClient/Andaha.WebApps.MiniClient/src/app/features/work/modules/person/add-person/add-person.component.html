<form class="page" [formGroup]="form" (ngSubmit)="onSubmit()">
  <div class="form-body">
    <label class="field" [class.invalid]="form.controls.name | showError">
      <span class="field-label">Name</span>
      <span class="field-box">
        <input formControlName="name" required [attr.aria-invalid]="form.controls.name | showError">
      </span>
    </label>

    <label class="field" [class.invalid]="form.controls.hourlyRate | showError">
      <span class="field-label">Stundensatz</span>
      <span class="field-box">
        <input formControlName="hourlyRate" type="number" required [attr.aria-invalid]="form.controls.hourlyRate | showError">
        <span class="suffix" aria-hidden="true">€</span>
      </span>
    </label>

    <label class="field" [class.invalid]="form.controls.notes | showError">
      <span class="field-label">Notizen</span>
      <span class="field-box ta">
        <textarea formControlName="notes" [attr.aria-invalid]="form.controls.notes | showError"></textarea>
      </span>
    </label>
  </div>

  <div class="actions">
    <button type="submit" class="btn pri" [disabled]="!form.valid || isSaving">
      @if (!isSaving) {
        <mat-icon>check</mat-icon><span>Speichern</span>
      }
      @if (isSaving) {
        <mat-spinner class="btn-spinner" [diameter]="18" /><span>Speichert …</span>
      }
    </button>
  </div>
</form>
