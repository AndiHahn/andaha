<app-dialog [title]="'Eintrag bearbeiten'">
  <mat-dialog-content>
    <form class="form" [formGroup]="form">
      <app-date-picker-form-field [control]="form.controls.date"
        label="Datum" />

      <!-- Beginn und Ende nebeneinander, Pause darunter wie in "Arbeitszeit erfassen" -->
      <div class="times">
        <app-time-picker-form-field label="Beginn"
          [defaultTime]="getNgxTime(form.controls.fromTime)"
          (timeChanged)="setFormTime(form.controls.fromTime, $event)"
          [disabled]="!isEditing" />

        <app-time-picker-form-field label="Ende"
          [defaultTime]="getNgxTime(form.controls.untilTime)"
          [error]="untilError"
          (timeChanged)="setFormTime(form.controls.untilTime, $event)"
          [disabled]="!isEditing" />
      </div>

      <app-time-picker-form-field label="Pause"
        [defaultTime]="getNgxTime(form.controls.break)"
        [error]="breakError"
        (timeChanged)="setFormTime(form.controls.break, $event)"
        [disabled]="!isEditing" />

      <div class="net">
        <span class="net-k">Arbeitszeit netto</span>
        <span class="net-v">{{ getWorkingTime() }}</span>
      </div>

      <label class="field" [class.invalid]="form.controls.notes | showError">
        <span class="field-label">Notizen</span>
        <span class="field-box ta">
          <textarea formControlName="notes" [attr.aria-invalid]="form.controls.notes | showError"></textarea>
        </span>
      </label>
    </form>
  </mat-dialog-content>

  <div class="progress-slot">
    @if (isDeleting) {
      <mat-progress-bar mode="indeterminate" color="accent" />
    }
  </div>

  @if (!isEditing) {
    <div class="actions">
      <button type="button" class="btn pri" (click)="onEditClick()" [disabled]="isDeleting || isSaving">
        @if (!isSaving) {
          <mat-icon>edit</mat-icon><span>Bearbeiten</span>
        }
        @if (isSaving) {
          <mat-spinner class="btn-spinner" [diameter]="18" /><span>Speichert …</span>
        }
      </button>
      <button type="button" class="btn del" (click)="onDeleteClick()" [disabled]="isEditing || isDeleting || isSaving">
        <mat-icon>delete</mat-icon><span>Löschen</span>
      </button>
    </div>
  }

  @if (isEditing) {
    <div class="actions">
      <button type="button" class="btn sec2" (click)="onCancelClick()">
        <mat-icon>close</mat-icon><span>Abbrechen</span>
      </button>
      <button type="button" class="btn pri" (click)="onSaveClick()" [disabled]="isSaving || !form.valid">
        @if (!isSaving) {
          <mat-icon>check</mat-icon><span>Speichern</span>
        }
        @if (isSaving) {
          <mat-spinner class="btn-spinner" [diameter]="18" /><span>Speichert …</span>
        }
      </button>
    </div>
  }
</app-dialog>
