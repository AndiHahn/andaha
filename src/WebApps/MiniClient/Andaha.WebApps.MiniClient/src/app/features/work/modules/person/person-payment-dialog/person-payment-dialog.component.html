<app-dialog [title]="title">
  <form class="dialog-form" [formGroup]="form" (ngSubmit)="onSubmit()">
    <mat-dialog-content>
      <div class="form">
        <label class="field" [class.invalid]="form.controls.payedHours | showError">
          <span class="field-label">Bezahlte Stunden</span>
          <span class="field-box">
            <input formControlName="payedHours" required autocomplete="off" placeholder="hh:mm"
              [attr.aria-invalid]="form.controls.payedHours | showError" [attr.aria-describedby]="(form.controls.payedHours | showError) ? 'payment-hours-error' : null">
            <span class="suffix" aria-hidden="true">h</span>
          </span>
          @if (form.controls.payedHours | showError) {
            <span class="field-error" id="payment-hours-error" role="alert">Bitte Stunden im Format hh:mm eingeben, größer als 0:00.</span>
          }
        </label>

        <!-- Betrag und Trinkgeld nebeneinander (Mockup 05, Zahlung) -->
        <div class="pair">
          <label class="field" [class.invalid]="form.controls.payedMoney | showError">
            <span class="field-label">Bezahlter Betrag</span>
            <span class="field-box">
              <input formControlName="payedMoney" type="number" required autocomplete="off"
                [attr.aria-invalid]="form.controls.payedMoney | showError" [attr.aria-describedby]="(form.controls.payedMoney | showError) ? 'payment-money-error' : null">
              <span class="suffix" aria-hidden="true">€</span>
            </span>
            @if (form.controls.payedMoney | showError) {
              <span class="field-error" id="payment-money-error" role="alert">Bitte einen Betrag größer als 0 eingeben.</span>
            }
          </label>

          <label class="field" [class.invalid]="form.controls.payedTip | showError">
            <span class="field-label">Trinkgeld</span>
            <span class="field-box">
              <input formControlName="payedTip" type="number" required autocomplete="off"
                [attr.aria-invalid]="form.controls.payedTip | showError" [attr.aria-describedby]="(form.controls.payedTip | showError) ? 'payment-tip-error' : null">
              <span class="suffix" aria-hidden="true">€</span>
            </span>
            @if (form.controls.payedTip | showError) {
              <span class="field-error" id="payment-tip-error" role="alert">Bitte 0 oder mehr eingeben.</span>
            }
          </label>
        </div>

        <label class="field" [class.invalid]="form.controls.notes | showError">
          <span class="field-label">Notizen</span>
          <span class="field-box ta">
            <textarea formControlName="notes" [attr.aria-invalid]="form.controls.notes | showError"></textarea>
          </span>
        </label>
      </div>
    </mat-dialog-content>

    <div class="actions">
      <button type="submit" class="btn pri" [disabled]="!form.valid || isSaving">
        @if (!isSaving) {
          <mat-icon>check</mat-icon><span>Speichern</span>
        }
        @if (isSaving) {
          <mat-spinner class="btn-spinner" [diameter]="18" /><span>Speichert …</span>
        }
      </button>
    </div>
  </form>
</app-dialog>
