<div class="page">
  <div class="body">
    <app-load-state [state]="loadState" emptyText="Keine Personen vorhanden. Über „Person hinzufügen“ oben legst du die erste an." (retry)="retry()">
      @if (persons) {
        <app-person-list [persons]="persons" />
      }
    </app-load-state>
  </div>

  <a mat-fab color="primary" class="fab" routerLink="create-working-entry" aria-label="Arbeitszeiten hinzufügen">
    <mat-icon>add</mat-icon>
  </a>
</div>
