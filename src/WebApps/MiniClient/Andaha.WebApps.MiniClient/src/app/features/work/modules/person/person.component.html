<div class="page">
  <div class="body">
    @if (!persons) {
      <div class="loading">
        <mat-spinner diameter="40" />
      </div>
    }

    @if (persons?.length == 0) {
      <div class="empty">
        Keine Personen vorhanden.
      </div>
    }

    @if (persons) {
      <app-person-list [persons]="persons" />
    }
  </div>

  <a mat-fab color="primary" class="fab" routerLink="create-working-entry" aria-label="Arbeitszeiten hinzufügen">
    <mat-icon>add</mat-icon>
  </a>
</div>
