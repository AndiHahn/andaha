<div class="page">
  <div class="body">
    <div *ngIf="!persons" class="loading">
      <mat-spinner diameter="40"></mat-spinner>
    </div>

    <div *ngIf="persons?.length == 0" class="empty">
      Keine Personen vorhanden.
    </div>

    <app-person-list *ngIf="persons" [persons]="persons"></app-person-list>
  </div>

  <div class="actions">
    <a class="btn pri" routerLink="create-working-entry">
      <mat-icon>schedule</mat-icon><span>Arbeitszeiten hinzufügen</span>
    </a>
    <a class="btn sec2" routerLink="create">
      <mat-icon>add</mat-icon><span>Person hinzufügen</span>
    </a>
  </div>
</div>
