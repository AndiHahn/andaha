<!-- Verlauf: Icon-Button in der Kopfzeile (PageTitleService.setAction, siehe ngOnInit) -->
<div class="page">
  <div class="progress-slot">
    @if (!income) {
      <mat-progress-bar mode="indeterminate" color="accent" />
    }
  </div>

  @if (income) {
    <form class="form-body" [formGroup]="form">
      <label class="field" [class.invalid]="form.controls.name | showError">
        <span class="field-label">Name</span>
        <span class="field-box">
          <input formControlName="name" required [attr.aria-invalid]="form.controls.name | showError">
        </span>
      </label>
      <div class="field" [class.invalid]="form.controls.duration | showError">
        <span class="field-label">Intervall</span>
        <span class="field-box">
          <mat-select formControlName="duration" required aria-label="Intervall">
            @for (duration of durationOptions; track duration) {
              <mat-option [value]="duration">
                {{ durationLabel.get(duration) }}
              </mat-option>
            }
          </mat-select>
          <mat-icon class="suffix" aria-hidden="true">expand_more</mat-icon>
        </span>
      </div>
      <label class="field" [class.invalid]="form.controls.value | showError">
        <span class="field-label">Betrag</span>
        <span class="field-box">
          <input class="value" formControlName="value" type="number" required [attr.aria-invalid]="form.controls.value | showError">
          <span class="suffix" aria-hidden="true">€</span>
        </span>
      </label>
    </form>
  }

  @if (income && !isEditing) {
    <div class="actions">
      <button type="button" class="btn pri" (click)="onEditClick()" [disabled]="isDeleting || isLoading || isSaving">
        @if (!isSaving) {
          <mat-icon>edit</mat-icon><span>Bearbeiten</span>
        }
        @if (isSaving) {
          <mat-spinner class="btn-spinner" [diameter]="18" /><span>Speichert …</span>
        }
      </button>
      <button type="button" class="btn del" (click)="onDeleteClick()"
        [disabled]="isEditing || isDeleting || isLoading || isSaving">
        <mat-icon>delete</mat-icon><span>Löschen</span>
      </button>
    </div>
  }

  @if (income && isEditing) {
    <div class="actions">
      <button type="button" class="btn sec2" (click)="onCancelClick()">
        <mat-icon>close</mat-icon><span>Abbrechen</span>
      </button>
      <button type="button" class="btn pri" (click)="onSaveClick()" [disabled]="isSaving">
        @if (!isSaving) {
          <mat-icon>check</mat-icon><span>Speichern</span>
        }
        @if (isSaving) {
          <mat-spinner class="btn-spinner" [diameter]="18" /><span>Speichert …</span>
        }
      </button>
    </div>
  }
</div>
