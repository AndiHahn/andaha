<p class="sec">Einkommen</p>

<div class="empty" *ngIf="incomes.length == 0">
  Keine Ausgaben.
</div>

<a class="row" *ngFor="let income of incomes" routerLink="{{income.id}}">
  <span class="t">{{ income.name }}</span>
  <span class="rc">
    <span class="amt">{{ income.value | number:'1.2-2':'de' }} €</span>
    <span class="per">{{ durationLabel.get(income.duration) }}</span>
  </span>
</a>
