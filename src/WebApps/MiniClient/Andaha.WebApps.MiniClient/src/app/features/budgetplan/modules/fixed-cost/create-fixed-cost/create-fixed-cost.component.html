<form class="page" [formGroup]="form" #formDirective="ngForm" (ngSubmit)="onSubmit(formDirective)">
  <div class="form-body">
    <label class="field" [class.invalid]="form.controls.name | showError: formDirective">
      <span class="field-label">Name</span>
      <span class="field-box">
        <input formControlName="name" required [attr.aria-invalid]="form.controls.name | showError: formDirective">
      </span>
    </label>

    <div class="field" [class.invalid]="form.controls.category | showError: formDirective">
      <span class="field-label">Kategorie</span>
      <span class="field-box">
        <mat-select formControlName="category" required aria-label="Kategorie">
          @for (category of costCategoryOptions; track category) {
            <mat-option [value]="category">
              {{ costCategoryLabel.get(category) }}
            </mat-option>
          }
        </mat-select>
        <mat-icon class="suffix" aria-hidden="true">expand_more</mat-icon>
      </span>
    </div>

    <div class="field" [class.invalid]="form.controls.duration | showError: formDirective">
      <span class="field-label">Intervall</span>
      <span class="field-box">
        <mat-select formControlName="duration" required aria-label="Intervall">
          @for (duration of durationOptions; track duration) {
            <mat-option [value]="duration">
              {{ durationLabel.get(duration) }}
            </mat-option>
          }
        </mat-select>
        <mat-icon class="suffix" aria-hidden="true">expand_more</mat-icon>
      </span>
    </div>

    <label class="field" [class.invalid]="form.controls.value | showError: formDirective">
      <span class="field-label">Kosten</span>
      <span class="field-box">
        <input class="value" formControlName="value" type="number" required [attr.aria-invalid]="form.controls.value | showError: formDirective">
        <span class="suffix" aria-hidden="true">€</span>
      </span>
    </label>
  </div>

  <div class="actions">
    <button type="submit" class="btn pri" [disabled]="!form.valid || isSaving">
      @if (!isSaving) {
        <mat-icon>check</mat-icon><span>Speichern</span>
      }
      @if (isSaving) {
        <mat-spinner class="btn-spinner" [diameter]="18" /><span>Speichert …</span>
      }
    </button>
  </div>
</form>
