<div class="page">
  <div class="body">
    @if (!fixedCosts) {
      <div class="loading">
        <mat-spinner diameter="40"></mat-spinner>
      </div>
    }

    @if (fixedCosts) {
      @for (costCategoryOption of costCategoryOptions; track costCategoryOption) {
        <app-fixed-cost-list
          [category]="costCategoryOption" [fixedCosts]="fixedCosts[costCategoryOption.toString()]">
        </app-fixed-cost-list>
      }
    }
  </div>

  <div class="actions">
    <a class="btn pri" routerLink="create">
      <mat-icon>add</mat-icon><span>Hinzufügen</span>
    </a>
  </div>
</div>
