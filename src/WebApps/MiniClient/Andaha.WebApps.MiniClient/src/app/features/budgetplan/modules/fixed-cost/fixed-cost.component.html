<div class="page">
  <div class="body">
    @if (!fixedCosts) {
      <div class="loading">
        <mat-spinner diameter="40" />
      </div>
    }

    @if (fixedCosts) {
      @for (costCategoryOption of costCategoryOptions; track costCategoryOption) {
        <app-fixed-cost-list [category]="costCategoryOption" [fixedCosts]="fixedCosts[costCategoryOption.toString()]" />
      }
    }
  </div>

  <a mat-fab color="primary" class="fab" routerLink="create" aria-label="Fixkosten hinzufügen">
    <mat-icon>add</mat-icon>
  </a>
</div>
