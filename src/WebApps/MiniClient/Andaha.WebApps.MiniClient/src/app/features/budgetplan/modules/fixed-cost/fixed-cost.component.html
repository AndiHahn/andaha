<div class="page">
  <div class="body">
    <div *ngIf="!fixedCosts" class="loading">
      <mat-spinner diameter="40"></mat-spinner>
    </div>

    <ng-container *ngIf="fixedCosts">
      <app-fixed-cost-list *ngFor="let costCategoryOption of costCategoryOptions"
        [category]="costCategoryOption" [fixedCosts]="fixedCosts[costCategoryOption.toString()]">
      </app-fixed-cost-list>
    </ng-container>
  </div>

  <div class="actions">
    <a class="btn pri" routerLink="create">
      <mat-icon>add</mat-icon><span>Hinzufügen</span>
    </a>
  </div>
</div>
