<div class="page">
  <div class="body">
    <app-load-state [state]="loadState" emptyText="Keine Einkommen." (retry)="retry()">
      @if (incomes) {
        <app-income-list [incomes]="incomes" />
      }
    </app-load-state>
  </div>

  <a mat-fab color="primary" class="fab" routerLink="create" aria-label="Einkommen hinzufügen">
    <mat-icon>add</mat-icon>
  </a>
</div>
