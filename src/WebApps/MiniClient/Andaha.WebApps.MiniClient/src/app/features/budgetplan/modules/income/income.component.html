<div class="page">
  <div class="body">
    @if (!incomes) {
      <div class="loading">
        <mat-spinner diameter="40"></mat-spinner>
      </div>
    }

    @if (incomes) {
      <div>
        <app-income-list [incomes]="incomes">
        </app-income-list>
      </div>
    }
  </div>

  <div class="actions">
    <a class="btn pri" routerLink="create">
      <mat-icon>add</mat-icon><span>Hinzufügen</span>
    </a>
  </div>
</div>
