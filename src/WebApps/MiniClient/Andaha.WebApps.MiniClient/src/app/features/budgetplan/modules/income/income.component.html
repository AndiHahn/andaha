<div class="page">
  <div class="body">
    @if (!incomes) {
      <div class="loading">
        <mat-spinner diameter="40" />
      </div>
    }

    @if (incomes) {
      <div>
        <app-income-list [incomes]="incomes" />
      </div>
    }
  </div>

  <a mat-fab color="primary" class="fab" routerLink="create" aria-label="Einkommen hinzufügen">
    <mat-icon>add</mat-icon>
  </a>
</div>
