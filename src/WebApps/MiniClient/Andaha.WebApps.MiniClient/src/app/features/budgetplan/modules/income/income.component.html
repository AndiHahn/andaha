<div class="page">
  <div class="body">
    <div *ngIf="!incomes" class="loading">
      <mat-spinner diameter="40"></mat-spinner>
    </div>

    <div *ngIf="incomes">
      <app-income-list [incomes]="incomes">
      </app-income-list>
    </div>
  </div>

  <div class="actions">
    <a class="btn pri" routerLink="create">
      <mat-icon>add</mat-icon><span>Hinzufügen</span>
    </a>
  </div>
</div>
