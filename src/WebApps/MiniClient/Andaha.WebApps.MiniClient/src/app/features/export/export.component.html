<p class="sec">Exportieren</p>

<button type="button" class="ex" (click)="onExportExpensesClick()" [disabled]="isExporting">
  <span class="ic"><mat-icon aria-hidden="true">receipt_long</mat-icon></span>
  <span class="tx">Ausgaben exportieren</span>
  <mat-spinner *ngIf="isExporting" [diameter]="20" aria-label="Export läuft"></mat-spinner>
  <mat-icon *ngIf="!isExporting" class="dl-icon" aria-hidden="true">download</mat-icon>
</button>

<button type="button" class="ex" (click)="onExportWorkInformationClick()" [disabled]="isExporting">
  <span class="ic"><mat-icon aria-hidden="true">group</mat-icon></span>
  <span class="tx">Personen/Arbeitszeiten exportieren</span>
  <mat-spinner *ngIf="isExporting" [diameter]="20" aria-label="Export läuft"></mat-spinner>
  <mat-icon *ngIf="!isExporting" class="dl-icon" aria-hidden="true">download</mat-icon>
</button>
