<p class="sec">Exportieren</p>

<button type="button" class="ex" (click)="onExportExpensesClick()" [disabled]="exporting !== null">
  <span class="ic"><mat-icon aria-hidden="true">receipt_long</mat-icon></span>
  <span class="tx">Ausgaben exportieren</span>
  @if (exporting === 'expenses') {
    <mat-spinner [diameter]="20" aria-label="Export läuft" />
  }
  @if (exporting !== 'expenses') {
    <mat-icon class="dl-icon" aria-hidden="true">download</mat-icon>
  }
</button>

<button type="button" class="ex" (click)="onExportWorkInformationClick()" [disabled]="exporting !== null">
  <span class="ic"><mat-icon aria-hidden="true">group</mat-icon></span>
  <span class="tx">Personen/Arbeitszeiten exportieren</span>
  @if (exporting === 'work') {
    <mat-spinner [diameter]="20" aria-label="Export läuft" />
  }
  @if (exporting !== 'work') {
    <mat-icon class="dl-icon" aria-hidden="true">download</mat-icon>
  }
</button>
