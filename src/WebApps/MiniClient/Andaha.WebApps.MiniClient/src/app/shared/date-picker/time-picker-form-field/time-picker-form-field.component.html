<label class="field">
  <span class="field-label">{{ label }}</span>
  <span class="field-box">
    <input
      [ngxMatTimepicker]="picker"
      [format]="format"
      [value]="defaultTime"
      [disabled]="disabled" />
    <mat-icon class="suffix" aria-hidden="true">schedule</mat-icon>
    <ngx-mat-timepicker #picker
      [minutesGap]="minutesGap"
      (timeSet)="ngxTimeSet($event)" />
  </span>
</label>
