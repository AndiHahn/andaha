@for (section of sections; track section.title) {
  <section>
    <h2 class="sect">{{ section.title }}</h2>
    @for (link of section.links; track link.path) {
      <a class="mrow" [routerLink]="link.path" (click)="link.startsTour && isPlainClick($event) && tour.request()">
        <mat-icon aria-hidden="true">{{ link.icon }}</mat-icon>
        <span class="label">{{ link.label }}</span>
        @if (link.counter === 'templates') {
          <span class="side">{{ templateCount() }}</span>
        }
        <mat-icon class="chev" aria-hidden="true">chevron_right</mat-icon>
      </a>
    }
  </section>
}

<nav class="links" aria-label="Rechtliches">
  @for (link of legalLinks; track link.path) {
    <a [routerLink]="link.path">{{ link.label }}</a>
  }
</nav>
